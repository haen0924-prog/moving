<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사물 이야기 숏폼 QR</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ff7a59,#ffb347);font-family:'Jua',sans-serif;color:#3a2e2a}
  .box{background:#fff;border-radius:32px;padding:40px 48px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.15);max-width:92vw}
  h1{font-size:44px;margin:0 0 8px}
  p{font-size:22px;color:#8a7a72;margin:0 0 24px}
  #qr{display:inline-block;padding:16px;background:#fff;border-radius:16px}
  #qr img,#qr canvas{width:min(60vh,70vw) !important;height:auto !important}
  .steps{display:flex;gap:18px;justify-content:center;margin-top:24px;font-size:22px;flex-wrap:wrap}
  .steps span{background:#fff1ec;padding:10px 18px;border-radius:14px}
  .url{margin-top:16px;font-size:16px;color:#8a7a72;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <h1>📷 사물 이야기 숏폼 🎬</h1>
  <p>QR을 찍으면 내 폰에서 바로 만들 수 있어요</p>
  <div id="qr"></div>
  <div class="steps">
    <span>① 사물 찍기</span><span>② 분위기 고르기</span><span>③ 영상 저장</span>
  </div>
  <div class="url" id="url"></div>
</div>
<script>
  const url = location.origin + '/';
  document.getElementById('url').textContent = url;
  new QRCode(document.getElementById('qr'), { text: url, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
</script>
</body>
</html>
